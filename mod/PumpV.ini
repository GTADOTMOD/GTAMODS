; PumpV - pump.fun on the GTA V phone. Lives next to PumpV.dll in GTA V\scripts.

[App]
; Name shown under the home-screen icon and as the app's header.
Name=RUGR
; Home-screen icon id. Only these have home-screen artwork:
; 1 Camera, 2 Texts, 4 Email, 5 Call, 6 EyeFind, 12 SideTasks, 14 Multiplayer,
; 17 Spare, 24 Settings, 27 MissedCall, 39 Checklist, 40 Sniper, 42 Trackify,
; 43 Save, 54 Lock, 57 Gang, 58 Tracker, 59 SightSeer, 62 Darnell
Icon=43
; Single player fills the first home page. With false the app goes on page 2;
; with true it may take the slot of the least useful stock icon instead.
ReplaceGameApp=false

[Theme]
; Show the app on its own modern phone over the game while it's open.
; false = use the game's plain phone list instead.
Panel=true
; If the phone window can't run, the app draws on the game's phone screen instead.
; These say where, from 0 to 1 across and down, leaving the phone's status bar and
; softkeys showing. Use a dot for decimals.
ScreenLeft=0
ScreenTop=0.065
ScreenWidth=1
ScreenHeight=0.86
; How big the text is.
TextSize=1.33

[Screenshot]
; While the app is open, this key saves a picture of the game and copies it, so it can
; be pasted anywhere. Files go in the PumpV folder under %LOCALAPPDATA%, in screenshots.
Key=P

[Companion]
; Folder with the companion's connection.json. Empty = %LOCALAPPDATA%\PumpV.
Dir=
; Trades wait for on-chain confirmation, which can take a while.
TimeoutSeconds=90

[Photo]
; Enter takes the photo in the camera. This key does too.
Key=F10
; Saved image size in pixels (square).
Size=512
